<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#180b03" />
    </radialGradient>
    
    <!-- Rich Golden Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Saffron Sun Aura -->
    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- Divine Glow Filter -->
    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="492" height="492" x="10" y="10" rx="120" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.75" stroke-dasharray="10 8" />

  <!-- Radiating Sacred Sunbeams -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <line x1="256" y1="48" x2="256" y2="78" />
    <line x1="256" y1="434" x2="256" y2="464" />
    <line x1="48" y1="256" x2="78" y2="256" />
    <line x1="434" y1="256" x2="464" y2="256" />
    <line x1="108" y1="108" x2="130" y2="130" />
    <line x1="382" y1="382" x2="404" y2="404" />
    <line x1="108" y1="404" x2="130" y2="382" />
    <line x1="382" y1="130" x2="404" y2="108" />
  </g>

  <!-- Central Solar Disc -->
  <circle cx="256" cy="245" r="170" fill="url(#sunAura)" />
  <circle cx="256" cy="245" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" stroke-dasharray="6 4" />

  <!-- Sacred Bajrangbali Gada (Mace) Iconography -->
  <g transform="translate(256, 250) rotate(-35) translate(-256, -250)" filter="url(#divineGlow)">
    <!-- Mace Head (Bulbous Fluted Dome) -->
    <path d="M 218 85 C 190 115 185 155 200 190 C 215 225 242 240 256 242 C 270 240 297 225 312 190 C 327 155 322 115 294 85 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3" />
    <!-- Fluting Ridge Accents -->
    <path d="M 256 80 L 256 242" stroke="#fffbeb" stroke-width="2.5" opacity="0.6" />
    <path d="M 230 100 C 220 140 230 200 242 230" stroke="#fffbeb" stroke-width="2" opacity="0.5" />
    <path d="M 282 100 C 292 140 282 200 270 230" stroke="#fffbeb" stroke-width="2" opacity="0.5" />

    <!-- Mace Crown / Spike -->
    <polygon points="256,48 266,85 246,85" fill="#fff" stroke="#f59e0b" stroke-width="2" />
    <circle cx="256" cy="46" r="6" fill="#fff" />

    <!-- Mace Shaft -->
    <rect x="249" y="240" width="14" height="200" rx="6" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
    <!-- Shaft Grip Bands -->
    <line x1="249" y1="290" x2="263" y2="290" stroke="#78350f" stroke-width="2.5" />
    <line x1="249" y1="340" x2="263" y2="340" stroke="#78350f" stroke-width="2.5" />
    <line x1="249" y1="390" x2="263" y2="390" stroke="#78350f" stroke-width="2.5" />

    <!-- Mace Bottom Finial Knob -->
    <circle cx="256" cy="445" r="18" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2.5" />
    <circle cx="256" cy="445" r="8" fill="#78350f" />
  </g>

  <!-- Auspicious Sacred Urdhva Pundra Tilak (Chandan & Sindoor) -->
  <g transform="translate(256, 175)" filter="url(#divineGlow)">
    <!-- White / Yellow Sandalwood V-Shape -->
    <path d="M -24 -45 L -8 28 C -3 36 3 36 8 28 L 24 -45 L 15 -45 L 0 16 L -15 -45 Z" fill="#ffffff" stroke="#fef08a" stroke-width="2" />
    <!-- Radiant Red Sindoor (Vermilion) Central Flame Streak -->
    <path d="M -4 -42 L -4 20 C -4 24 4 24 4 20 L 4 -42 Z" fill="#dc2626" />
    <!-- Auspicious Sindoor Lotus Bindi at Base -->
    <circle cx="0" cy="34" r="5" fill="#dc2626" />
  </g>

  <!-- Sacred Sanskrit Footer Calligraphy -->
  <text x="256" y="478" text-anchor="middle" font-family="'Rozha One', 'Cinzel', serif, sans-serif" font-size="24" font-weight="bold" fill="#fef08a" letter-spacing="4" filter="url(#divineGlow)">॥ ॐ हनुमते नमः ॥</text>
</svg>
